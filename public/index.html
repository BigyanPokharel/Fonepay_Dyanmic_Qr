<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fonepay QR – Instant Payment</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #f6f9fc 0%, #e9f1f7 100%);
      padding: 20px;
      margin: 0;
      pointer-events: none;
      user-select: none;
    }

    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 32px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 20, 30, 0.12), 0 8px 24px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      background: #0a7d3e;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 22px;
      box-shadow: 0 6px 14px rgba(10, 125, 62, 0.25);
    }

    .brand h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #0b1e2a;
    }

    .brand span {
      color: #0a7d3e;
    }

    .subtitle {
      color: #5b6f7e;
      font-size: 0.95rem;
      margin-bottom: 28px;
      line-height: 1.4;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #1e2c38;
      margin-bottom: 4px;
      letter-spacing: 0.01em;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e2eaf0;
      border-radius: 16px;
      font-size: 1rem;
      background: white;
      transition: border 0.2s, box-shadow 0.2s;
      margin-bottom: 18px;
      outline: none;
      pointer-events: auto;
      user-select: text;
    }

    input:focus {
      border-color: #0a7d3e;
      box-shadow: 0 0 0 4px rgba(10, 125, 62, 0.12);
    }

    input::placeholder {
      color: #aab9c7;
    }

    button, a.bill-link {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 16px;
      background: #0a7d3e;
      color: white;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 8px 20px rgba(10, 125, 62, 0.25);
      pointer-events: auto;
      user-select: none;
      display: block;
      text-align: center;
      text-decoration: none;
      box-sizing: border-box;
    }

    button:hover:not(:disabled), a.bill-link:hover {
      background: #086b34;
      transform: scale(0.98);
    }

    button:disabled {
      background: #8bb7a0;
      cursor: not-allowed;
      box-shadow: none;
    }

    #qrArea {
      margin-top: 24px;
      display: none;
      text-align: center;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.94); }
      to { opacity: 1; transform: scale(1); }
    }

    #qrImage {
      display: block;
      margin: 0 auto 12px auto;
      width: 200px;
      height: 200px;
      border-radius: 20px;
      background: white;
      padding: 8px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.06);
      border: 2px solid #f0f4f8;
    }

    #invoiceDetails {
      margin: 12px auto 12px;
      background: #f0f6fa;
      border-radius: 20px;
      padding: 14px 18px;
      text-align: left;
      font-size: 0.9rem;
      color: #2d4050;
      line-height: 1.6;
      display: inline-block;
      min-width: 220px;
    }

    #invoiceDetails div {
      display: flex;
      gap: 6px;
      align-items: baseline;
      margin-bottom: 4px;
    }

    #invoiceDetails div:last-child {
      margin-bottom: 0;
    }

    #invoiceDetails strong {
      flex: 0 0 90px;
      font-weight: 600;
      color: #1e2c38;
    }

    #status {
      display: inline-block;
      margin-top: 8px;
      padding: 8px 24px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.9rem;
      background: #fff7e6;
      color: #b7791f;
      transition: background 0.3s, color 0.3s;
    }

    .status-scanned {
      background: #e6f3ff;
      color: #1a6fc4;
    }
    .status-paid {
      background: #e6f8ee;
      color: #0a7d3e;
    }
    .status-failed,
    .status-timeout {
      background: #fdecea;
      color: #c0392b;
    }

    #billArea {
      margin-top: 14px;
      display: none;
    }

    #errorMsg {
      color: #c0392b;
      font-size: 0.9rem;
      margin-top: 12px;
      display: none;
      padding: 8px 14px;
      background: #fdecea;
      border-radius: 12px;
    }

    @media (max-width: 480px) {
      .card { padding: 28px 20px; }
      #qrImage { width: 160px; height: 160px; }
      #invoiceDetails { min-width: 180px; }
      #invoiceDetails strong { flex: 0 0 75px; }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="brand">
      <div class="brand-icon">रु</div>
      <h1>Pay<span>QR</span></h1>
    </div>
    <p class="subtitle">Scan with any Fonepay‑supported app &mdash; instant confirmation.</p>

    <form id="checkoutForm" autocomplete="off">
      <label for="amount">Amount (NPR)</label>
      <input type="number" id="amount" min="1" step="0.01" placeholder="e.g. 150" required autofocus />

      <label for="remarks1">Remarks</label>
      <input type="text" id="remarks1" placeholder="enter remark" maxlength="12" />

      <button type="submit" id="generateBtn">Generate QR</button>
    </form>

    <div id="errorMsg"></div>

    <div id="qrArea">
      <img id="qrImage" alt="Fonepay QR code" />

      <div id="invoiceDetails">
        <div><strong>Invoice No:</strong> <span id="invoiceNo"></span></div>
        <div><strong>Amount:</strong>रु<span id="invoiceAmount"></span></div>
        <div><strong>Remarks:</strong> <span id="invoiceRemarks"></span></div>
      </div>

      <div><span id="status">Waiting for scan…</span></div>

      <div id="billArea">
        <a id="billLink" class="bill-link" href="#" target="_blank" rel="noopener">View &amp; Download Bill</a>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const form = document.getElementById('checkoutForm');
      const generateBtn = document.getElementById('generateBtn');
      const qrArea = document.getElementById('qrArea');
      const qrImage = document.getElementById('qrImage');
      const invoiceNoEl = document.getElementById('invoiceNo');
      const invoiceAmountEl = document.getElementById('invoiceAmount');
      const invoiceRemarksEl = document.getElementById('invoiceRemarks');
      const statusEl = document.getElementById('status');
      const errorEl = document.getElementById('errorMsg');
      const remarks1Input = document.getElementById('remarks1');
      const billArea = document.getElementById('billArea');
      const billLink = document.getElementById('billLink');

      let socket = null;

      remarks1Input.addEventListener('input', () => {
        remarks1Input.value = remarks1Input.value.replace(/[^a-zA-Z0-9 ]/g, '').slice(0, 12);
      });

      function setStatus(text, cssClass) {
        statusEl.textContent = text;
        statusEl.className = cssClass || '';
      }

      function showError(message) {
        errorEl.textContent = message;
        errorEl.style.display = 'block';
      }

      function hideError() {
        errorEl.style.display = 'none';
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideError();
        generateBtn.disabled = true;
        generateBtn.textContent = 'Generating…';
        billArea.style.display = 'none';

        const amount = document.getElementById('amount').value;
        const remarks1 = remarks1Input.value.replace(/[^a-zA-Z0-9 ]/g, '').slice(0, 12).trim();

        try {
          const res = await fetch('/api/qr', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ amount, remarks1 }),
          });
          const data = await res.json();

          if (!res.ok) throw new Error(data.error || 'Failed to generate QR');

          invoiceNoEl.textContent = data.invoiceNo;
          invoiceAmountEl.textContent = amount;
          invoiceRemarksEl.textContent = remarks1 || '—';

          qrImage.src = data.qrImageDataUrl;
          qrImage.style.display = 'block';
          qrArea.style.display = 'block';
          setStatus('Waiting for scan…', 'status-pending');

          connectToOrderSocket(data.prn, data.orderToken);
        } catch (err) {
          showError(err.message);
        } finally {
          generateBtn.disabled = false;
          generateBtn.textContent = 'Generate QR';
        }
      });

      function connectToOrderSocket(prn, orderToken) {
        if (socket) socket.close();

        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        socket = new WebSocket(
          `${protocol}//${location.host}/ws?prn=${encodeURIComponent(prn)}&token=${encodeURIComponent(orderToken)}`
        );

        socket.onmessage = (event) => {
          const msg = JSON.parse(event.data);
          switch (msg.type) {
            case 'qr_scanned':
              setStatus('QR scanned — confirming payment…', 'status-scanned');
              qrImage.style.display = 'none';
              break;
            case 'paid':
              setStatus('Payment successful ✓', 'status-paid');
              if (msg.billUrl) {
                billLink.href = msg.billUrl;
                billArea.style.display = 'block';
              }
              socket.close();
              break;
            case 'failed':
              setStatus('Payment failed', 'status-failed');
              socket.close();
              break;
            case 'timeout':
              setStatus('QR expired — please try again', 'status-timeout');
              socket.close();
              break;
            case 'error':
              showError(msg.message);
              break;
            default:
              break;
          }
        };

        socket.onerror = () => showError('Lost connection to server');
      }
    })();
  </script>

</body>
</html>
